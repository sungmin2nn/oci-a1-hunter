name: diag temp ip owner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli
      - name: Configure OCI
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
      - name: Compare instance IPs by hash (public log, no names or addresses)
        env:
          T: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          set -u
          regions=$(oci iam region-subscription list --tenancy-id "$T" --query 'data[]."region-name"' --raw-output | jq -r '.[]')
          comps=$( (echo "$T"; oci iam compartment list -c "$T" --compartment-id-in-subtree true --all --query 'data[].id' --raw-output 2>/dev/null | jq -r '.[]?') )
          echo "regions=$(echo "$regions" | wc -l) compartments=$(echo "$comps" | wc -l)"
          n=0; ips=0
          for r in $regions; do
            for c in $comps; do
              list=$(oci compute instance list -c "$c" --region "$r" --all 2>/dev/null) || continue
              [ -z "$list" ] && continue
              while IFS=$'\t' read -r id state shape created; do
                [ -z "$id" ] && continue
                n=$((n+1))
                for v in $(oci compute vnic-attachment list -c "$c" --region "$r" --instance-id "$id" --all --query 'data[]."vnic-id"' --raw-output 2>/dev/null | jq -r '.[]?'); do
                  ip=$(oci network vnic get --region "$r" --vnic-id "$v" --query 'data."public-ip"' --raw-output 2>/dev/null)
                  [ -z "$ip" ] && continue
                  ips=$((ips+1))
                  h=$(printf '%s' "$ip" | sha256sum | cut -c1-16)
                  echo "instance#$n state=$state shape=$shape created=${created:0:10} iphash=$h"
                done
                [ -n "$ip" ] || echo "instance#$n state=$state shape=$shape created=${created:0:10} iphash=none"
              done < <(echo "$list" | jq -r '.data[] | [.id, ."lifecycle-state", .shape, ."time-created"] | @tsv')
            done
          done
          echo "total_instances=$n public_ips=$ips"
